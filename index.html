<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>LAUNCH. Game Demo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
    /* Camera feed fills the screen; the transparent 3D canvas sits on top of it */
    video, canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    video { object-fit: cover; filter: brightness(0.65); } /* dimmed so the bright outlines pop */

    /* Full-screen overlays, stacked on top of the 3D canvas */
    .overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    /* The Start page, shown before the game; main.js hides it when the game begins */
    #start { background: #a67b5b; } /* French beige */
    #start button { font-size: 24px; padding: 16px 32px; }
    #hud { pointer-events: none; }
    #round { position: fixed; top: 16px; width: 100%; text-align: center; color: #fff; text-shadow: 0 0 4px #000; pointer-events: none; }
    #done { background: #000; flex-direction: column; gap: 24px; display: none; }
    #done h1 { margin: 0; font-size: 64px; letter-spacing: 8px; }
    #scores { font-size: 22px; line-height: 1.6; text-align: center; }
  </style>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>

  <!-- Start page. Needs a tap so iOS will ask for motion permission. -->
  <div id="start" class="overlay">
    <button>Start</button>
  </div>

  <!-- HUD: the target outline + progress ring, fixed in the centre of the screen -->
  <svg id="hud" class="overlay" viewBox="-100 -100 200 200" width="100%" height="100%">
    <circle r="60" fill="none" stroke="#000" stroke-width="10" opacity="0.5" /> <!-- dark track so the ring shows on any background -->
    <circle id="ring" r="60" fill="none" stroke="#0f0" stroke-width="4"
            stroke-dasharray="377" stroke-dashoffset="377" transform="rotate(-90)" />
  </svg>

  <div id="round"></div>

  <!-- DONE screen: the score is filled in by main.js -->
  <div id="done" class="overlay">
    <h1>DONE</h1>
    <div id="scores"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
